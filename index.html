<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>PERSONAL ARCHIVE</title>
<meta name="description" content="자작 캐릭터 페어 디데이 · 커미션 갤러리 · 로그 아카이브" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0B0C'/%3E%3Cpath d='M16 4 L18 14 L28 16 L18 18 L16 28 L14 18 L4 16 L14 14 Z' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#E8E8E5" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="ARCHIVE" />
<meta name="application-name" content="ARCHIVE" />

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* ═══════════════════════════════════════════════════════════
   PERSONAL ARCHIVE — neo-swiss system  v2
   그리드 · 헤어라인 · 모노 라벨 · 플랫 윈도우
   ═══════════════════════════════════════════════════════════ */
:root{
  --paper:#E8E8E5; --pane:#FFFFFF; --ink:#0A0A0B; --line:#0A0A0B;
  --g1:#6C6C71; --g2:#B4B4B8; --g3:#DEDEDB; --g4:#F3F3F1;
  --danger:#B3170A; --accent:#1F4BFF;
  --chip-bg:#0A0A0B; --chip-fg:#FFFFFF; --hover:#F5F5F3;
  --sans:"Helvetica Neue",Helvetica,Inter,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
  --rail:236px; --tap:44px; --gap:20px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --paper:#101012; --pane:#191A1C; --ink:#EDEDEA; --line:#3A3A3F;
  --g1:#9A9AA1; --g2:#55555B; --g3:#2A2A2E; --g4:#212124;
  --danger:#FF6B5A; --chip-bg:#EDEDEA; --chip-fg:#101012; --hover:#212124;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0; background:var(--paper); color:var(--ink);}
body{font-family:var(--sans); -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  min-height:100dvh; overflow-x:hidden;}
button,input,select,textarea{font-family:inherit; border-radius:0; color:inherit;}
button{-webkit-tap-highlight-color:transparent;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
img{max-width:100%;}
::selection{background:var(--accent); color:#fff;}

/* 공통 타이포 유틸 */
.mono{font-family:var(--mono); font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--g1);}
.serif{font-family:Georgia,"Times New Roman",serif; font-style:italic;}
.num{font-variant-numeric:tabular-nums;}

/* ───────────────────────────── SHELL ───────────────────────────── */
.app{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:100dvh;}

/* 사이드 레일 (데스크톱) */
.rail{position:sticky; top:0; height:100dvh; border-right:1px solid var(--line);
  background:var(--paper); display:flex; flex-direction:column; z-index:20;}
.rail-mark{border-bottom:1px solid var(--line); padding:20px 18px 16px;}
.rail-mark h1{margin:0; font-size:30px; line-height:.9; letter-spacing:-.045em; font-weight:700;
  text-transform:lowercase; word-break:break-word;}
.rail-mark h1 .dot{color:var(--accent);}
.rail-mark p{margin:8px 0 0;}
.rail-nav{display:flex; flex-direction:column; padding:10px 0; flex:1;}
.navitem{display:flex; align-items:center; gap:10px; padding:11px 18px; border:none; background:none;
  cursor:pointer; text-align:left; font-size:12px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink); position:relative;}
.navitem i{font-family:var(--mono); font-style:normal; font-size:9px; color:var(--g2); letter-spacing:.06em;}
.navitem span{flex:1;}
.navitem b{font-family:var(--mono); font-weight:400; font-size:9px; color:var(--g2);}
.navitem:hover{background:var(--hover);}
.navitem.on{background:var(--chip-bg); color:var(--chip-fg);}
.navitem.on i,.navitem.on b{color:var(--accent);}
.rail-foot{border-top:1px solid var(--line); padding:14px 18px; display:flex; flex-direction:column; gap:8px;}
.rail-state{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.dotstate{width:7px; height:7px; background:var(--g2); display:block;}
.dotstate.live{background:var(--accent);}
.dotstate.err{background:var(--danger);}
.rail-theme{display:flex; gap:0;}
.rail-theme button{flex:1; border:1px solid var(--line); background:var(--pane); cursor:pointer;
  font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; padding:6px 2px; margin-right:-1px; text-transform:uppercase;}
.rail-theme button.on{background:var(--chip-bg); color:var(--chip-fg);}

/* 콘텐츠 */
.content{min-width:0; display:flex; flex-direction:column;}
.topbar{position:sticky; top:0; z-index:15; background:var(--paper);
  border-bottom:1px solid var(--line); padding:14px 24px;
  display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap;}
.topbar-h{min-width:0; flex:1;}
.topbar-h h2{margin:2px 0 0; font-size:clamp(24px,3.4vw,40px); line-height:.95; letter-spacing:-.04em; font-weight:700;}
.topbar-h .sub{margin:6px 0 0; font-size:12.5px; color:var(--g1);}
.topbar-act{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.sheet{padding:24px; display:flex; flex-direction:column; gap:var(--gap); flex:1;}

/* 모바일 마스트헤드 / 바텀 내비 (기본 숨김) */
.mast{display:none;}
.bottomnav{display:none;}

/* ───────────────────────────── PANEL ───────────────────────────── */
.panel{background:var(--pane); border:1px solid var(--line); min-width:0;}
.panel-bar{display:flex; align-items:center; gap:10px; min-height:30px; padding:0 10px;
  border-bottom:1px solid var(--line);}
.panel-idx{font-family:var(--mono); font-size:9px; letter-spacing:.08em; background:var(--chip-bg);
  color:var(--chip-fg); padding:3px 5px;}
.panel-t{font-family:var(--mono); font-size:9.5px; letter-spacing:.2em; text-transform:uppercase;
  font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.panel-meta{margin-left:auto; font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:var(--g1); white-space:nowrap;}
.panel-glyph{display:flex; align-items:center; gap:5px; margin-left:auto;}
.panel-meta + .panel-glyph{margin-left:10px;}
.sq{width:7px; height:7px; border:1px solid currentColor; display:block; opacity:.75;}
.xmark{width:9px; height:9px; display:block;}
.xmark line{stroke:currentColor; stroke-width:1.4;}
.panel-act{display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:10px; border-bottom:1px solid var(--g3);}
.panel-body{padding:16px;}
.panel.flush .panel-body{padding:0;}

/* 열 그리드 */
.cols{display:grid; gap:var(--gap); grid-template-columns:repeat(12,minmax(0,1fr));}
.c4{grid-column:span 4;} .c5{grid-column:span 5;} .c6{grid-column:span 6;}
.c7{grid-column:span 7;} .c8{grid-column:span 8;} .c12{grid-column:span 12;}

/* ───────────────────────────── CONTROLS ───────────────────────────── */
.btn{border:1px solid var(--line); background:var(--pane); color:var(--ink); font-size:11px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; padding:0 14px; height:38px; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap;}
.btn:hover{background:var(--hover);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn.primary:hover{filter:brightness(.92);}
.btn.dark{background:var(--chip-bg); border-color:var(--chip-bg); color:var(--chip-fg);}
.btn.danger{color:var(--danger); border-color:var(--danger);}
.btn.danger:hover{background:var(--danger); color:#fff;}
.btn[disabled]{opacity:.45; cursor:default;}
.btn.filebtn{position:relative; overflow:hidden;}
.btn.filebtn input{position:absolute; inset:0; opacity:0; cursor:pointer;}
.sel,.search{border:1px solid var(--g2); background:var(--pane); font-family:var(--mono); font-size:10px;
  letter-spacing:.08em; padding:0 8px; height:38px; text-transform:uppercase; min-width:0;}
.search{text-transform:none; flex:1 1 180px;}
.seg{display:flex;}
.seg button{flex:1; border:1px solid var(--line); background:var(--pane); padding:9px 8px; font-size:10.5px;
  font-weight:700; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; margin-right:-1px;}
.seg button.on{background:var(--chip-bg); color:var(--chip-fg);}
.chips{display:flex; gap:6px; flex-wrap:wrap; padding:10px; border-bottom:1px solid var(--g3);}
.chip{border:1px solid var(--g2); background:var(--pane); color:var(--ink); cursor:pointer;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; padding:5px 8px;
  display:flex; gap:5px; align-items:center;}
.chip i{font-style:normal; color:var(--g2); font-size:8.5px;}
.chip:hover{border-color:var(--ink);}
.chip.on{background:var(--chip-bg); color:var(--chip-fg); border-color:var(--chip-bg);}
.chip.on i{color:var(--chip-fg); opacity:.6;}
.mini{border:none; background:none; padding:6px 0; font-family:var(--mono); font-size:9.5px;
  letter-spacing:.14em; text-transform:uppercase; cursor:pointer; color:var(--g1); border-bottom:1px solid var(--g2);}
.mini:hover{color:var(--ink); border-color:var(--ink);}
.mini.del:hover{color:var(--danger); border-color:var(--danger);}
.linkbtn{background:none; border:none; padding:6px 0; font-family:var(--mono); font-size:9.5px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--g1); cursor:pointer; border-bottom:1px solid var(--g2);}
.linkbtn:hover{color:var(--ink); border-color:var(--ink);}

/* ───────────────────────────── DASHBOARD ───────────────────────────── */
.hero{background:var(--chip-bg); color:var(--chip-fg); border:1px solid var(--line); padding:22px 20px;
  display:flex; flex-direction:column; gap:16px; min-height:100%;}
.hero .mono{color:rgba(255,255,255,.55);}
html[data-theme="dark"] .hero .mono{color:rgba(0,0,0,.5);}
.hero-count{display:flex; align-items:baseline; gap:6px;}
.hero-count .pre{font-family:var(--mono); font-size:13px; font-weight:700; color:var(--accent);}
.hero-count .big{font-size:clamp(56px,7vw,88px); font-weight:700; letter-spacing:-.05em; line-height:.8;}
.hero-count .unit{font-family:var(--mono); font-size:10px; letter-spacing:.1em; opacity:.6;}
.hero-name{font-size:17px; font-weight:700; letter-spacing:-.02em; margin:0;}
.hero-bar{height:6px; border:1px solid currentColor; margin-top:2px;}
.hero-bar span{display:block; height:100%; background:var(--accent);}
.hero-foot{margin-top:auto; display:flex; justify-content:space-between; gap:10px; align-items:baseline;}
.stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; background:var(--g3);}
.stats div{background:var(--pane); padding:14px 12px;}
.stats dt{font-family:var(--mono); font-size:9px; letter-spacing:.16em; color:var(--g1); text-transform:uppercase;}
.stats dd{margin:6px 0 0; font-size:30px; font-weight:700; letter-spacing:-.04em; line-height:1;}
.quick{display:flex; flex-wrap:wrap; gap:8px; padding:10px;}
.quick .btn{flex:1 1 auto;}
.recentgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:1px; background:var(--g3);}
.recentgrid button{border:none; padding:0; background:var(--pane); cursor:pointer; aspect-ratio:1/1;}
.recentgrid img{width:100%; height:100%; object-fit:cover; display:block;}
.searchwrap{position:relative;}
.results{list-style:none; margin:0; padding:0; border-top:1px solid var(--g3);}
.results li + li{border-top:1px solid var(--g3);}
.results button{width:100%; display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:10px;
  align-items:center; background:var(--pane); border:none; cursor:pointer; text-align:left; padding:11px 12px;}
.results button:hover{background:var(--hover);}
.results .kind{font-family:var(--mono); font-size:8.5px; letter-spacing:.12em; color:var(--chip-fg);
  background:var(--chip-bg); padding:3px 4px; text-align:center;}
.results .rt{font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.results .rx{font-size:11px; color:var(--g1); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.results .rd{font-family:var(--mono); font-size:9px; color:var(--g1); white-space:nowrap;}

/* ───────────────────────────── D-DAY ───────────────────────────── */
.grid{display:grid; gap:1px; background:var(--g3);}
.grid-pairs{grid-template-columns:repeat(auto-fill,minmax(276px,1fr));}
.grid-gal{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));}
.grid-gal.dense{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));}
.card{background:var(--pane); padding:16px; display:flex; flex-direction:column;}
.card-head{display:flex; justify-content:space-between; align-items:center; gap:8px;
  font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:var(--g1); text-transform:uppercase;}
.card-tag{color:var(--accent); font-weight:700; display:flex; align-items:center; gap:4px;}
.pair-name{font-size:20px; letter-spacing:-.025em; font-weight:700; margin:12px 0 0; line-height:1.2;}
.cross{color:var(--accent); font-weight:400;}
.pair-sub{margin:4px 0 0; font-family:Georgia,serif; font-style:italic; font-size:12.5px; color:var(--g1);}
.count{display:flex; align-items:baseline; gap:4px; margin:16px 0 4px; border-top:1px solid var(--line); padding-top:12px;}
.count .pre{font-family:var(--mono); font-size:13px; font-weight:700; color:var(--accent);}
.count .big{font-size:clamp(46px,7vw,62px); font-weight:700; letter-spacing:-.05em; line-height:.82;}
.count .unit{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--g1);}
.ms{margin-top:14px;}
.ms-row{display:flex; justify-content:space-between; gap:8px; font-family:var(--mono); font-size:9px;
  letter-spacing:.12em; text-transform:uppercase;}
.ms-track{height:6px; border:1px solid var(--line); margin:5px 0;
  background:repeating-linear-gradient(45deg,var(--g3) 0 3px,transparent 3px 6px);}
.ms-fill{display:block; height:100%; background:var(--accent);}
.ms-foot{color:var(--g1);}
.card-memo{font-size:12.5px; line-height:1.6; color:var(--g1); margin:14px 0 0; white-space:pre-wrap;}
.card-foot{display:flex; gap:16px; margin-top:auto; padding-top:16px;}
.soon{list-style:none; margin:0; padding:0;}
.soon li{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center;
  padding:12px 14px; border-top:1px solid var(--g3);}
.soon li:first-child{border-top:none;}
.soon-d{font-family:var(--mono); font-size:11px; font-weight:700; color:#fff; background:var(--accent);
  padding:3px 6px; letter-spacing:.06em;}
.soon-main{min-width:0; display:flex; flex-direction:column; gap:2px;}
.soon-main b{font-size:13.5px; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.soon-main span{font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:var(--g1); text-transform:uppercase;}
.soon-date{font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--g1); white-space:nowrap;}

/* ───────────────────────────── GALLERY ───────────────────────────── */
.thumb{background:var(--pane); border:none; padding:10px; cursor:pointer; text-align:left; display:block; width:100%;}
.thumb:hover{background:var(--hover);}
.frame{display:block; position:relative; border:1px solid var(--line); aspect-ratio:1/1; overflow:hidden; background:var(--g3);}
.frame img{width:100%; height:100%; object-fit:cover; display:block;}
.cnt{position:absolute; top:0; right:0; background:var(--chip-bg); color:var(--chip-fg);
  font-family:var(--mono); font-size:9px; letter-spacing:.08em; padding:3px 5px;
  border-left:1px solid var(--line); border-bottom:1px solid var(--line);}
.thumb-meta{display:grid; grid-template-columns:auto minmax(0,1fr); gap:2px 8px; margin-top:9px; align-items:baseline;}
.thumb-n{font-family:var(--mono); font-size:9px; color:var(--chip-fg); background:var(--chip-bg);
  padding:1px 4px; grid-row:span 2;}
.thumb-t{font-size:12px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.thumb-a{font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--accent);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.imgph{width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:9px; letter-spacing:.2em; color:var(--g1);}
.stage{position:relative;}
.view-img{display:block; width:100%; border:1px solid var(--line); background:var(--g3); padding:8px;
  text-align:center; cursor:zoom-in;}
.view-img img{max-height:52vh; display:block; margin:0 auto;}
.nav{position:absolute; top:50%; transform:translateY(-50%); width:36px; height:56px; border:1px solid var(--line);
  background:var(--pane); font-size:20px; line-height:1; cursor:pointer; display:flex;
  align-items:center; justify-content:center; padding:0;}
.nav:hover{background:var(--chip-bg); color:var(--chip-fg);}
.nav.prev{left:8px;} .nav.next{right:8px;}
.pageno{position:absolute; left:8px; bottom:8px; background:var(--chip-bg); color:var(--chip-fg);
  font-family:var(--mono); font-size:9px; letter-spacing:.14em; padding:3px 6px;}
.strip{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
.strip::-webkit-scrollbar{height:4px;}
.strip::-webkit-scrollbar-thumb{background:var(--g2);}
.stripcell{flex:0 0 62px; height:62px; border:1px solid var(--g2); background:var(--g3); padding:0;
  cursor:pointer; overflow:hidden;}
.stripcell img{width:100%; height:100%; object-fit:cover; display:block;}
.stripcell.on{border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent);}
.zoom{position:fixed; inset:0; z-index:70; background:rgba(10,10,11,.94); display:flex;
  align-items:center; justify-content:center; padding:16px; cursor:zoom-out;}
.zoom img{max-width:100%; max-height:88dvh; object-fit:contain;}
.zoom-hint{position:absolute; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom)); text-align:center;
  font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:rgba(255,255,255,.6); text-transform:uppercase;}

/* ───────────────────────────── LOGS ───────────────────────────── */
.logs{list-style:none; margin:0; padding:0;}
.logs li + li{border-top:1px solid var(--g3);}
.log{width:100%; background:var(--pane); border:none; cursor:pointer; text-align:left;
  display:grid; grid-template-columns:38px minmax(0,1fr) auto; gap:14px; align-items:baseline; padding:15px 14px;}
.log:hover{background:var(--hover);}
.log:hover .log-t{color:var(--accent);}
.log-n{font-family:var(--mono); font-size:9px; color:var(--g2); letter-spacing:.1em;}
.log-main{min-width:0;}
.log-t{display:block; font-size:14.5px; font-weight:700; letter-spacing:-.02em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.log-badge{font-family:var(--mono); font-size:8px; letter-spacing:.1em; border:1px solid var(--g2);
  padding:1px 3px; color:var(--g1); margin-left:6px; vertical-align:middle;}
.log-ex{display:block; font-size:11.5px; color:var(--g1); margin-top:4px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap;}
.log-side{text-align:right; font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--g1); white-space:nowrap;}
.log-pair{display:block; color:var(--accent); margin-top:4px;}

/* ───────────────────────────── EMPTY ───────────────────────────── */
.empty{padding:48px 20px; text-align:center; background:var(--pane);}
.empty p{max-width:400px; margin:14px auto 18px; font-size:13px; line-height:1.7; color:var(--g1);}
.star{display:block; margin:0 auto;}

/* ───────────────────────────── MODAL ───────────────────────────── */
.scrim{position:fixed; inset:0; background:rgba(10,10,11,.6); display:flex; align-items:flex-start;
  justify-content:center; padding:28px 16px; overflow:auto; z-index:60;}
.modal{background:var(--pane); border:1px solid var(--line); width:100%; max-width:560px; margin:auto;}
.modal.wide{max-width:820px;}

/* ── date utils ── */
const pad = n => String(n).padStart(2,"0");
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const parseISO = s => { const [y,m,d]=(s||"").split("-").map(Number); return Date.UTC(y,(m||1)-1,d||1); };
const DAY = 86400000;
const diffDays = (a,b) => Math.round((parseISO(b)-parseISO(a))/DAY);

function nextMilestone(startISO, current){
  const c = [];
  for (let i=1;i<=200;i++) c.push({count:i*100, label:`${i*100}일`});
  const [Y,M,D] = startISO.split("-").map(Number);
  for (let y=1;y<=50;y++){
    const t = new Date(Date.UTC(Y+y, M-1, D));
    const iso = `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`;
    c.push({count: diffDays(startISO, iso)+1, label:`${y}주년`});
  }
  c.sort((a,b)=>a.count-b.count);
  const next = c.find(x=>x.count>current);
  const prev = [...c].reverse().find(x=>x.count<=current);
  return { next, prevCount: prev ? prev.count : 1 };
}

/* ── image compression ── */
function readFile(file){
  return new Promise((res,rej)=>{ const r=new FileReader();
    r.onload=()=>res(r.result); r.onerror=()=>rej(new Error("read")); r.readAsDataURL(file); });
}
async function compress(file, maxDim=1600){
  const raw = await readFile(file);
  const img = await new Promise((res,rej)=>{ const i=new Image();
    i.onload=()=>res(i); i.onerror=()=>rej(new Error("decode")); i.src=raw; });
  let w=img.width, h=img.height;
  const s = Math.min(1, maxDim/Math.max(w,h));
  w=Math.round(w*s); h=Math.round(h*s);
  const c=document.createElement("canvas"); c.width=w; c.height=h;

  return { blob, dataUrl, w, h };
}

/* ═══════════════════════════════════════════════════════════
   STORE — cloud(Supabase) / local(this browser)
   ═══════════════════════════════════════════════════════════ */
const EMPTY = { version:1, settings:{accent:"#1F4BFF", title:"PERSONAL ARCHIVE", owner:""},
  pairs:[], gallery:[], logs:[] };

function makeCloudStore(sb, user){
  return {
    mode:"cloud",
    label: user.email,
    async load(){
      const { data, error } = await sb.from("archive_data").select("payload").eq("user_id", user.id).maybeSingle();
      if (error) throw error;
      return data && data.payload ? { ...EMPTY, ...data.payload } : { ...EMPTY };
    },
    async save(payload){
      const { error } = await sb.from("archive_data")
        .upsert({ user_id:user.id, payload, updated_at:new Date().toISOString() }, { onConflict:"user_id" });
      if (error) throw error;
    },
    async putImage(id, blob){
      const path = `${user.id}/${id}.jpg`;
      const { error } = await sb.storage.from(CONFIG.BUCKET)
        .upload(path, blob, { contentType:"image/jpeg", upsert:true });
      if (error) throw error;
      const { data } = sb.storage.from(CONFIG.BUCKET).getPublicUrl(path);
      return { src: data.publicUrl, path };
    },
    async delImage(item){
      if (item.path) await sb.storage.from(CONFIG.BUCKET).remove([item.path]);
    },
    resolve(item){ return item.src || ""; },
    async signOut(){ await sb.auth.signOut(); }
  };
}

function makeLocalStore(){
  return {
    mode:"local",
    label:"이 브라우저",
    async load(){
      try{ const d=JSON.parse(localStorage.getItem(LS_LOCAL)||"null");
        return d ? { ...EMPTY, ...d } : { ...EMPTY }; }catch(e){ return { ...EMPTY }; }
    },
    async save(payload){ localStorage.setItem(LS_LOCAL, JSON.stringify(payload)); },
    async putImage(id, blob, dataUrl){
      try{ localStorage.setItem("archive.img."+id, dataUrl); }
      catch(e){ throw new Error("이 브라우저의 저장 공간이 가득 찼습니다."); }
      return { src:"local:"+id, path:null };
    },
    async delImage(item){ if (item.src && item.src.startsWith("local:"))
      localStorage.removeItem("archive.img."+item.src.slice(6)); },
    resolve(item){
      if (item.src && item.src.startsWith("local:")) return localStorage.getItem("archive.img."+item.src.slice(6)) || "";
      return item.src || "";
    },
    async signOut(){ sessionStorage.removeItem(LS_PASS); }
  };
}
/* ═══════════════════════════════════════════════════════════
   MARKDOWN — 외부 라이브러리 없이 직접 변환 (입력은 먼저 이스케이프)
   ═══════════════════════════════════════════════════════════ */
const escHtml = s => String(s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const safeUrl = u => /^(https?:\/\/|mailto:|#|\/)/i.test(String(u).trim()) ? String(u).trim() : "#";

function mdInline(raw){
  let s = escHtml(raw);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m,c)=>{ codes.push(c); return `\u0000${codes.length-1}\u0000`; });
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m,a,u)=>`<img src="${safeUrl(u)}" alt="${a}">`);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
    (m,t,u)=>`<a href="${safeUrl(u)}" target="_blank" rel="noopener noreferrer">${t}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
       .replace(/__([^_]+)__/g,"<strong>$1</strong>")
       .replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>")
       .replace(/~~([^~]+)~~/g,"<del>$1</del>");
  s = s.replace(/\u0000(\d+)\u0000/g, (m,i)=>`<code>${escHtml(codes[i])}</code>`);
  return s;
}

function mdToHtml(src){
  const lines = String(src||"").replace(/\r\n?/g,"\n").split("\n");
  const out = []; let para = [], list = null, i = 0;
  const flushP = ()=>{ if(para.length){ out.push(`<p>${para.map(mdInline).join("<br>")}</p>`); para=[]; } };
  const flushL = ()=>{ if(list){
    const attr = (list.t==="ol" && list.start>1) ? ` start="${list.start}"` : "";
    out.push(`<${list.t}${attr}>${list.items.map(x=>`<li>${mdInline(x)}</li>`).join("")}</${list.t}>`);
    list=null;
  } };

  while (i < lines.length){
    const ln = lines[i];
    if (/^```/.test(ln)){
      flushP(); flushL(); const buf=[]; i++;
      while (i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${escHtml(buf.join("\n"))}</code></pre>`); continue;
    }
    if (/^\s*$/.test(ln)){ flushP(); flushL(); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)){ flushP(); flushL(); out.push("<hr>"); i++; continue; }
    const h = ln.match(/^(#{1,4})\s+(.*)$/);
    if (h){ flushP(); flushL(); const lv = Math.min(h[1].length+1, 5);
      out.push(`<h${lv}>${mdInline(h[2])}</h${lv}>`); i++; continue; }
    if (/^>\s?/.test(ln)){
      flushP(); flushL(); const buf=[];
      while (i<lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,""));
      out.push(`<blockquote>${buf.map(mdInline).join("<br>")}</blockquote>`); continue;
    }
    const ul = ln.match(/^\s*[-*+]\s+(.*)$/);
    const ol = ln.match(/^\s*(\d+)[.)]\s+(.*)$/);
    if (ul || ol){
      flushP(); const t = ul ? "ul" : "ol";
      if (!list || list.t !== t){
        flushL();
        list = { t, items:[], start: ol ? parseInt(ol[1],10) : 1 };
      }
      list.items.push(ul ? ul[1] : ol[2]); i++; continue;
    }
    flushL(); para.push(ln); i++;
  }
  flushP(); flushL();
  return out.join("");
}

const stripMd = s => String(s||"")
  .replace(/```[\s\S]*?```/g," ")
  .replace(/!\[[^\]]*\]\([^)]*\)/g," ")
  .replace(/\[([^\]]+)\]\([^)]*\)/g,"$1")
  .replace(/^\s*[#>\-*+]+\s*/gm,"")
  .replace(/[*_`~]/g,"")
  .replace(/\s+/g," ").trim();

const Md = ({ text, className, style }) =>
  <div className={`md ${className||""}`} style={style} dangerouslySetInnerHTML={{__html: mdToHtml(text)}}/>;

/* ── HTML 백업 ── 붙여넣은 코드를 그대로 보관하되, 위험한 태그·속성만 걸러 렌더링 */
const HTML_DROP = new Set(["script","style","link","meta","base","iframe","frame","frameset","object",
  "embed","applet","form","input","button","select","textarea","option","svg","math","noscript"]);
const HTML_KEEP = new Set(["p","br","hr","div","span","h1","h2","h3","h4","h5","h6","ul","ol","li",
  "blockquote","pre","code","em","strong","i","b","u","s","del","ins","a","img","figure","figcaption",
  "table","thead","tbody","tfoot","tr","th","td","caption","col","colgroup","dl","dt","dd",
  "small","sub","sup","mark","abbr","cite","q","center","font","section","article","header","footer","main","aside"]);
const HTML_ATTR = new Set(["href","src","alt","title","style","colspan","rowspan","width","height",
  "align","valign","color","size","face","border","cellpadding","cellspacing","target","rel","loading"]);

function sanitizeHtml(raw){
  try{
    const doc = new DOMParser().parseFromString(String(raw||""), "text/html");
    doc.body.querySelectorAll("*").forEach(el=>{
      const tag = el.tagName.toLowerCase();
      if (HTML_DROP.has(tag)){ el.remove(); return; }
      if (!HTML_KEEP.has(tag)){                       // 모르는 태그는 껍데기만 벗기고 내용은 살림
        const parent = el.parentNode;
        if (!parent) return;
        while (el.firstChild) parent.insertBefore(el.firstChild, el);
        parent.removeChild(el);
        return;
      }
      [...el.attributes].forEach(a=>{
        const n = a.name.toLowerCase();
        if (n.startsWith("on") || !HTML_ATTR.has(n)) return el.removeAttribute(a.name);
        if ((n==="href" || n==="src") && !/^(https?:\/\/|mailto:|data:image\/|#|\/)/i.test(a.value.trim()))
          return el.removeAttribute(a.name);
        if (n==="style")
          el.setAttribute("style", a.value.replace(/(position|z-index)\s*:[^;]*;?/gi,""));
      });
      if (tag==="a"){ el.setAttribute("target","_blank"); el.setAttribute("rel","noopener noreferrer"); }
      if (tag==="img"){ el.setAttribute("loading","lazy"); }
    });
    return doc.body.innerHTML;
  }catch(e){ return escHtml(raw); }
}

const isHtml = l => !!l && l.format === "html";
const plainOf = l => isHtml(l)
  ? String(l.body||"").replace(/<[^>]*>/g," ").replace(/&[a-z]+;/gi," ").replace(/\s+/g," ").trim()
  : stripMd(l && l.body);

/* 글 본문 — 형식에 맞는 렌더러 선택 */
const Body = ({ log, className, style }) => isHtml(log)
  ? <div className={`htmlbody ${className||""}`} style={style}
      dangerouslySetInnerHTML={{__html: sanitizeHtml(log.body)}}/>
  : <Md text={log.body} className={className} style={style}/>;
/* ═══════════════════════════════════════════════════════════
   PRIMITIVES
   ═══════════════════════════════════════════════════════════ */
const Star = ({size=26, color="var(--accent)"}) => (
  <svg className="star" width={size} height={size} viewBox="0 0 32 32" aria-hidden="true">
    <path d="M16 0 C17 11 21 15 32 16 C21 17 17 21 16 32 C15 21 11 17 0 16 C11 15 15 11 16 0 Z" fill={color}/>
  </svg>
);
const XIcon = () => (
  <svg className="xmark" viewBox="0 0 10 10" aria-hidden="true">
    <line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/>
  </svg>
);

function Panel({ idx, title, meta, actions, children, flush, className }){
  return (
    <section className={`panel ${flush?"flush":""} ${className||""}`}>
      <header className="panel-bar">
        {idx ? <span className="panel-idx">{idx}</span> : null}
        <span className="panel-t">{title}</span>
        {meta ? <span className="panel-meta">{meta}</span> : null}
        <span className="panel-glyph" aria-hidden="true"><i className="sq"/><i className="sq"/><XIcon/></span>
      </header>
      {actions ? <div className="panel-act">{actions}</div> : null}
      <div className="panel-body">{children}</div>
    </section>
  );
}
const Btn = ({children, variant="", ...rest}) =>
  <button type="button" className={`btn ${variant}`} {...rest}>{children}</button>;
const Field = ({label, hint, children}) => (
  <label className="field"><span className="lab">{label}{hint?<em>{hint}</em>:null}</span>{children}</label>
);
function Modal({ title, idx="—", onClose, children, wide }){
  useEffect(()=>{
    const h=e=>e.key==="Escape"&&onClose();
    window.addEventListener("keydown",h);
    const b=document.body, y=window.scrollY;
    const prev={position:b.style.position, top:b.style.top, left:b.style.left,
      right:b.style.right, width:b.style.width, overflow:b.style.overflow};
    b.style.position="fixed"; b.style.top=`-${y}px`; b.style.left="0";
    b.style.right="0"; b.style.width="100%"; b.style.overflow="hidden";
    return ()=>{
      window.removeEventListener("keydown",h);
      Object.assign(b.style, prev);
      window.scrollTo(0,y);
    };
  },[onClose]);
  return (
    <div className="scrim" onMouseDown={e=>e.target===e.currentTarget&&onClose()}>
      <div className={`modal ${wide?"wide":""}`} role="dialog" aria-modal="true">
        <header className="panel-bar">
          <span className="panel-idx">{idx}</span><span className="panel-t">{title}</span>
          <span className="panel-glyph"><button className="close" onClick={onClose} aria-label="닫기"><XIcon/></button></span>
        </header>
        <div className="modal-body">{children}</div>
      </div>
    </div>
  );
}
const Empty = ({line, action}) => (
  <div className="empty"><Star/><p>{line}</p>{action}</div>
);
function Pic({ item, store, alt, className }){
  const src = store.resolve(item);
  if (!src) return <div className="imgph"><span>NO IMAGE</span></div>;
  return <img src={src} alt={alt} className={className} loading="lazy" />;
}

/* ═══════════════════════════════════════════════════════════
   GATE — 로그인
   ═══════════════════════════════════════════════════════════ */
function Gate({ onCloud, onLocal }){
  const [cfg, setCfg] = useState(readCfg());
  const [sb, setSb] = useState(null);
  const [mode, setMode] = useState("in");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [setup, setSetup] = useState(!readCfg());
  const [url, setUrl] = useState(cfg?cfg.url:"");
  const [key, setKey] = useState(cfg?cfg.key:"");

  useEffect(()=>{
    if (!cfg) return;
    const client = window.supabase.createClient(cfg.url, cfg.key);
    setSb(client);
    client.auth.getSession().then(({data})=>{ if (data.session) onCloud(client, data.session.user); });
  },[cfg]);

  const submit = async () => {
    if (!sb) return;
    if (!email.trim() || !pw) return setMsg({bad:true, text:"아이디(이메일)와 비밀번호를 모두 입력해 주세요."});
    setBusy(true); setMsg(null);
    try{
      if (mode==="up"){
        const { data, error } = await sb.auth.signUp({ email:email.trim(), password:pw });
        if (error) throw error;
        if (data.session) onCloud(sb, data.session.user);
        else setMsg({ok:true, text:"확인 메일을 보냈습니다. 메일에서 인증한 뒤 로그인해 주세요."});
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email:email.trim(), password:pw });
        if (error) throw error;
        onCloud(sb, data.session.user);
      }
    }catch(e){
      const m = (e && e.message) || "";
      setMsg({bad:true, text:
        /Invalid login/i.test(m) ? "아이디 또는 비밀번호가 맞지 않습니다." :
        /already registered/i.test(m) ? "이미 가입된 아이디입니다. 로그인해 주세요." :
        /Password should be/i.test(m) ? "비밀번호는 6자 이상이어야 합니다." : m || "요청을 처리하지 못했습니다."});
    }
    setBusy(false);
  };

  return (
    <div className="gate">
      <div className="gate-art">
        <div>
          <p className="mono">Personal Archive · {fmtDate(todayISO())}</p>
          <h1>archive<span className="dot">·</span></h1>
        </div>
        <div>
          <p className="serif" style={{margin:"0 0 6px", fontSize:15, opacity:.75}}>The Record of Ours</p>
          <p className="mono">Character pairs / commissioned works / logs</p>
        </div>
        <span className="gate-star"><Star size={280} color="currentColor"/></span>
      </div>

      <div className="gate-form">
        <div className="gate-form-in">
          {setup ? (
            <Panel idx="00" title="CONNECT / 저장소 연결">
              <div className="form">
                <p className="note" style={{marginTop:0}}>
                  기록을 계정에 저장하려면 Supabase 프로젝트 주소와 anon key가 필요합니다.
                  README의 절차대로 값을 붙여넣어 주세요. 이 브라우저에 기억됩니다.
                </p>
                <Field label="Project URL"><input className="in" value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://xxxx.supabase.co"/></Field>
                <Field label="Anon key"><input className="in" value={key} onChange={e=>setKey(e.target.value)} placeholder="eyJhbGciOi…"/></Field>
                <div className="foot">
                  <Btn onClick={onLocal}>이 브라우저에만 저장</Btn>
                  <Btn variant="primary" onClick={()=>{
                    if(!url.trim()||!key.trim()) return alert("두 값을 모두 입력해 주세요.");
                    writeCfg(url.trim(), key.trim()); setCfg(readCfg()); setSetup(false);
                  }}>연결하기</Btn>
                </div>
              </div>
            </Panel>
          ) : (
            <Panel idx="00" title={mode==="up" ? "SIGN UP / 계정 만들기" : "SIGN IN / 로그인"}>
              <div className="form">
                <div className="seg">
                  <button className={mode==="in"?"on":""} onClick={()=>{setMode("in");setMsg(null);}}>로그인</button>
                  <button className={mode==="up"?"on":""} onClick={()=>{setMode("up");setMsg(null);}}>계정 만들기</button>
                </div>
                <Field label="아이디" hint="이메일">
                  <input className="in" type="email" autoComplete="username" value={email}
                    onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="you@example.com"/>
                </Field>
                <Field label="비밀번호" hint="6자 이상">
                  <input className="in" type="password" autoComplete={mode==="up"?"new-password":"current-password"}
                    value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="••••••••"/>
                </Field>
                {msg ? <div className={`msg ${msg.bad?"bad":"ok"}`}>{msg.text}</div> : null}
                <Btn variant="primary" onClick={submit} disabled={busy||!sb}>
                  {busy ? "확인 중…" : mode==="up" ? "계정 만들고 시작하기" : "로그인"}
                </Btn>
                <p className="note small" style={{marginTop:2}}>
                  한 번 로그인하면 이 브라우저에서는 유지되고, 다른 기기에서는 같은 아이디로 로그인하면 기록이 이어집니다.
                </p>
                <div style={{display:"flex", gap:16, flexWrap:"wrap"}}>
                  <button className="linkbtn" onClick={()=>setSetup(true)}>저장소 다시 연결</button>
                  <button className="linkbtn" onClick={onLocal}>연결 없이 둘러보기</button>
                </div>
              </div>
            </Panel>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   APP — 레일 / 바텀 내비 셸
   ═══════════════════════════════════════════════════════════ */
const TABS = [
  ["home","00","OVERVIEW","한눈에 보기"],
  ["pairs","01","D-DAY","페어 기록"],
  ["gallery","02","GALLERY","커미션 아카이브"],
  ["logs","03","LOGS","글 아카이브"],
  ["settings","04","SETTINGS","설정"],
];

function App(){
  const [store, setStore] = useState(null);
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("home");
  const [status, setStatus] = useState("READY");
  const [savedAt, setSavedAt] = useState(null);
  const [intent, setIntent] = useState(null);       // {action:"new"} | {focus:id}
  const timer = useRef(null);
  const latest = useRef(null);

  const enterCloud = useCallback(async (sb, user)=>{
    const s = makeCloudStore(sb, user);
    try{ const d = await s.load(); setStore(s); setData(d); }
    catch(e){ alert("기록을 불러오지 못했습니다: " + (e.message||"")); }
  },[]);
  const enterLocal = useCallback(async ()=>{
    const s = makeLocalStore();
    const d = await s.load(); setStore(s); setData(d);
  },[]);

  useEffect(()=>{ document.documentElement.style.setProperty("--accent",
    (data && data.settings && data.settings.accent) || "#1F4BFF"); },[data]);

  const theme = (data && data.settings && data.settings.theme) || "auto";
  useEffect(()=>{
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const apply = () => {
      const dark = theme==="dark" || (theme==="auto" && mq.matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", dark ? "#101012" : "#E8E8E5");
    };
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
    return ()=>{ if (mq.removeEventListener) mq.removeEventListener("change", apply); };
  },[theme]);

  const flush = useCallback(async ()=>{
    if (!store || !latest.current) return;
    setStatus("SAVING");
    try{
      await store.save(latest.current);
      setSavedAt(new Date()); setStatus("SAVED");
      setTimeout(()=>setStatus("READY"),1400);
    }catch(e){ setStatus("SAVE FAILED"); }
  },[store]);

  const mutate = useCallback(updater=>{
    setData(prev=>{
      const next = typeof updater==="function" ? updater(prev) : updater;
      latest.current = next;
      clearTimeout(timer.current);
      timer.current = setTimeout(flush, 600);
      setStatus("SAVING");
      return next;
    });
  },[flush]);

  useEffect(()=>{
    const h = e => { if (status==="SAVING"){ e.preventDefault(); e.returnValue=""; } };
    window.addEventListener("beforeunload", h);
    return ()=>window.removeEventListener("beforeunload", h);
  },[status]);

  /* 데스크톱 단축키: 1–5 탭 이동 */
  useEffect(()=>{
    const h = e => {
      if (e.metaKey||e.ctrlKey||e.altKey) return;
      const el = document.activeElement;
      if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
      if (document.querySelector(".scrim")) return;
      const i = "12345".indexOf(e.key);
      if (i >= 0) setTab(TABS[i][0]);
    };
    window.addEventListener("keydown", h);
    return ()=>window.removeEventListener("keydown", h);
  },[]);

  const go = (t, payload=null) => { setTab(t); setIntent(payload); };

  if (!store || !data) return <Gate onCloud={enterCloud} onLocal={enterLocal} />;

  const S = data.settings;
  const setPairs = v => mutate(d=>({...d, pairs: typeof v==="function"?v(d.pairs):v}));
  const setGallery = v => mutate(d=>({...d, gallery: typeof v==="function"?v(d.gallery):v}));
  const setLogs = v => mutate(d=>({...d, logs: typeof v==="function"?v(d.logs):v}));
  const setSettings = v => mutate(d=>({...d, settings:{...d.settings, ...v}}));
  const cur = TABS.find(t=>t[0]===tab) || TABS[0];
  const counts = { home:"", pairs:pad(data.pairs.length), gallery:pad(data.gallery.length), logs:pad(data.logs.length), settings:"" };

  return (
    <div className="app">
      {/* 데스크톱 레일 */}
      <aside className="rail">
        <div className="rail-mark">
          <p className="mono">ARCHIVE · {fmtDate(todayISO())}</p>
          <h1>{(S.title||"personal archive").toLowerCase()}<span className="dot">·</span></h1>
          <p className="mono">{S.owner ? `KEEPER / ${S.owner}` : store.label}</p>
        </div>
        <nav className="rail-nav" aria-label="섹션">
          {TABS.map(([id,n,label])=>(
            <button key={id} className={`navitem ${tab===id?"on":""}`} onClick={()=>go(id)}>
              <i>{n}</i><span>{label}</span><b>{counts[id]}</b>
            </button>
          ))}
        </nav>
        <div className="rail-foot">
          <div className="rail-state">
            <span className="mono">{status==="SAVE FAILED" ? "저장 실패" : savedAt ? `${pad(savedAt.getHours())}:${pad(savedAt.getMinutes())} 저장됨` : "대기 중"}</span>
            <i className={`dotstate ${status==="SAVE FAILED"?"err":status!=="READY"?"live":""}`}/>
          </div>
          <div className="rail-theme">
            {[["light","LIGHT"],["dark","DARK"],["auto","AUTO"]].map(([v,l])=>(
              <button key={v} className={theme===v?"on":""} onClick={()=>setSettings({theme:v})}>{l}</button>
            ))}
          </div>
        </div>
      </aside>

      <div className="content">
        {/* 모바일 마스트헤드 */}
        <header className="mast">
          <div className="mast-top">
            <span className="mono">ARCHIVE · {fmtDate(todayISO())}</span>
            <span className="rule"/>
            <span className="mono">{status==="SAVE FAILED" ? "저장 실패" : status!=="READY" ? "저장 중" : "동기화됨"}</span>
          </div>
          <h1>{(S.title||"personal archive").toLowerCase()}<span className="dot">·</span></h1>
        </header>

        <div className="topbar">
          <div className="topbar-h">
            <p className="mono">{cur[1]} / {cur[2]}</p>
            <h2>{cur[3]}</h2>
          </div>
          <div className="topbar-act">
            {tab==="pairs" && <Btn variant="primary" onClick={()=>setIntent({action:"new",at:Date.now()})}>+ 페어 추가</Btn>}
            {tab==="gallery" && <Btn variant="primary" onClick={()=>setIntent({action:"new",at:Date.now()})}>+ 그림 등록</Btn>}
            {tab==="logs" && <Btn variant="primary" onClick={()=>setIntent({action:"new",at:Date.now()})}>+ 새 글 쓰기</Btn>}
          </div>
        </div>

        <main className="sheet">
          {tab==="home" && <Dashboard data={data} store={store} go={go}/>}
          {tab==="pairs" && <PairsView pairs={data.pairs} setPairs={setPairs} intent={intent} clear={()=>setIntent(null)}/>}
          {tab==="gallery" && <GalleryView gallery={data.gallery} setGallery={setGallery} pairs={data.pairs}
            store={store} setStatus={setStatus} intent={intent} clear={()=>setIntent(null)}/>}
          {tab==="logs" && <LogsView logs={data.logs} setLogs={setLogs} pairs={data.pairs}
            intent={intent} clear={()=>setIntent(null)}/>}
          {tab==="settings" && <SettingsView data={data} setSettings={setSettings} store={store} mutate={mutate}
            onSignOut={async()=>{ await flush(); await store.signOut(); location.reload(); }}/>}
        </main>
      </div>

      {/* 모바일 바텀 내비 */}
      <nav className="bottomnav" aria-label="섹션">
        {TABS.map(([id,n,label])=>(
          <button key={id} className={tab===id?"on":""} onClick={()=>go(id)} aria-current={tab===id?"page":undefined}>
            <em/><b>{label}</b>
          </button>
        ))}
      </nav>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   00 · DASHBOARD
   ═══════════════════════════════════════════════════════════ */
function Dashboard({ data, store, go }){
  const [q, setQ] = useState("");
  const { pairs, gallery, logs } = data;

  const lead = useMemo(()=>{
    const withCount = pairs.map(p=>({ p, count:countFrom(p.startDate) }));
    if (!withCount.length) return null;
    const pin = withCount.find(x=>x.p.pinned);
    return pin || withCount.sort((a,b)=>b.count-a.count)[0];
  },[pairs]);

  const soon = useMemo(()=>pairs.map(p=>{
    const count = countFrom(p.startDate);
    const { next } = nextMilestone(p.startDate, count);
    if (!next) return null;
    const left = next.count - count;
    return left<=60 ? { p, label:next.label, left, on:addDaysISO(p.startDate, next.count-1) } : null;
  }).filter(Boolean).sort((a,b)=>a.left-b.left).slice(0,5),[pairs]);

  const recentGal = useMemo(()=>[...gallery]
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,8),[gallery]);
  const recentLogs = useMemo(()=>[...logs]
    .sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0)).slice(0,5),[logs]);

  const results = useMemo(()=>{
    const n = q.trim().toLowerCase();
    if (!n) return [];
    const out = [];
    logs.forEach(l=>{
      if (((l.title||"")+" "+plainOf(l)+" "+(l.tags||[]).join(" ")).toLowerCase().includes(n))
        out.push({ kind:"LOG", id:l.id, title:l.title||"무제", sub:plainOf(l).slice(0,60), date:l.date, to:"logs" });
    });
    gallery.forEach(g=>{
      if (((g.title||"")+" "+(g.artist||"")+" "+(g.tags||[]).join(" ")+" "+(g.note||"")).toLowerCase().includes(n))
        out.push({ kind:"ART", id:g.id, title:g.title||"UNTITLED", sub:g.artist?`@${g.artist}`:"", date:g.date, to:"gallery" });
    });
    pairs.forEach(p=>{
      if (`${p.nameA} ${p.nameB} ${p.title||""}`.toLowerCase().includes(n))
        out.push({ kind:"PAIR", id:p.id, title:`${p.nameA} × ${p.nameB}`, sub:p.title||"", date:p.startDate, to:"pairs" });
    });
    return out.slice(0,12);
  },[q, logs, gallery, pairs]);

  const ms = lead ? nextMilestone(lead.p.startDate, lead.count) : null;
  const prog = ms && ms.next
    ? Math.max(0, Math.min(1,(lead.count-ms.prevCount)/(ms.next.count-ms.prevCount))) : 0;

  return (
    <>
      <div className="cols">
        <div className="c5">
          {lead ? (
            <div className="hero">
              <div>
                <p className="mono" style={{margin:0}}>SINCE {fmtDate(lead.p.startDate)}</p>
                <p className="hero-name" style={{marginTop:8}}>
                  {lead.p.nameA}<span className="cross"> × </span>{lead.p.nameB}
                </p>
              </div>
              <div className="hero-count">
                <span className="pre">D+</span>
                <span className="big num">{lead.count>0?lead.count:0}</span>
                <span className="unit">일째</span>
              </div>
              {ms && ms.next ? (
                <div>
                  <div className="hero-bar"><span style={{width:`${prog*100}%`}}/></div>
                  <div className="hero-foot">
                    <span className="mono">NEXT · {ms.next.label}</span>
                    <span className="mono">{ms.next.count-lead.count===0 ? "TODAY" : `D-${ms.next.count-lead.count}`}</span>
                  </div>
                </div>
              ) : null}
            </div>
          ) : (
            <Panel idx="00" title="START / 시작하기">
              <p className="note" style={{marginTop:0}}>첫 페어를 등록하면 오늘이 며칠째인지 여기에 크게 표시됩니다.</p>
              <div className="foot"><Btn variant="primary" onClick={()=>go("pairs",{action:"new",at:Date.now()})}>+ 페어 추가</Btn></div>
            </Panel>
          )}
        </div>

        <div className="c7">
          <div style={{display:"flex", flexDirection:"column", gap:"var(--gap)"}}>
            <Panel idx="SUM" title="ARCHIVE / 기록 현황" flush>
              <dl className="stats">
                <div><dt>PAIRS</dt><dd className="num">{pairs.length}</dd></div>
                <div><dt>IMAGES</dt><dd className="num">{gallery.reduce((n,g)=>n+imagesOf(g).length,0)}</dd></div>
                <div><dt>LOGS</dt><dd className="num">{logs.length}</dd></div>
              </dl>
              <div className="quick">
                <Btn onClick={()=>go("logs",{action:"new",at:Date.now()})}>+ 새 글</Btn>
                <Btn onClick={()=>go("gallery",{action:"new",at:Date.now()})}>+ 그림 등록</Btn>
                <Btn onClick={()=>go("pairs",{action:"new",at:Date.now()})}>+ 페어 추가</Btn>
              </div>
            </Panel>

            <Panel idx="FIND" title="SEARCH / 전체 검색" flush>
              <div className="panel-act">
                <input className="search" value={q} onChange={e=>setQ(e.target.value)}
                  placeholder="글·그림·페어를 한 번에 검색"/>
              </div>
              {q.trim() ? (
                results.length ? (
                  <ul className="results">
                    {results.map(r=>(
                      <li key={r.kind+r.id}>
                        <button onClick={()=>go(r.to,{focus:r.id, at:Date.now()})}>
                          <span className="kind">{r.kind}</span>
                          <span style={{minWidth:0}}>
                            <span className="rt">{r.title}</span>
                            {r.sub ? <span className="rx">{r.sub}</span> : null}
                          </span>
                          <span className="rd">{fmtDate(r.date)}</span>
                        </button>
                      </li>
                    ))}
                  </ul>
                ) : <div className="panel-body"><p className="note" style={{margin:0}}>일치하는 기록이 없습니다.</p></div>
              ) : null}
            </Panel>
          </div>
        </div>
      </div>

      {soon.length ? (
        <Panel idx="NXT" title="UPCOMING / 다가오는 기념일" meta={`${pad(soon.length)}`} flush>
          <ul className="soon">
            {soon.map(s=>(
              <li key={s.p.id}>
                <span className="soon-d">{s.left===0 ? "TODAY" : `D-${s.left}`}</span>
                <span className="soon-main"><b>{s.p.nameA} × {s.p.nameB}</b><span>{s.label}</span></span>
                <span className="soon-date">{fmtDate(s.on)}</span>
              </li>
            ))}
          </ul>
        </Panel>
      ) : null}

      <div className="cols">
        <div className="c6">
          <Panel idx="02" title="RECENT / 최근 그림" meta={`${pad(gallery.length)}`} flush>
            {recentGal.length ? (
              <div className="recentgrid">
                {recentGal.map(g=>(
                  <button key={g.id} onClick={()=>go("gallery",{focus:g.id, at:Date.now()})} title={g.title||"UNTITLED"}>
                    <Pic item={imagesOf(g)[0]||{}} store={store} alt={g.title||"작품"}/>
                  </button>
                ))}
              </div>
            ) : <div className="panel-body"><p className="note" style={{margin:0}}>등록한 그림이 아직 없습니다.</p></div>}
          </Panel>
        </div>
        <div className="c6">
          <Panel idx="03" title="RECENT / 최근 글" meta={`${pad(logs.length)}`} flush>
            {recentLogs.length ? (
              <ul className="logs">
                {recentLogs.map((l,i)=>(
                  <li key={l.id}>
                    <button className="log" onClick={()=>go("logs",{focus:l.id, at:Date.now()})}>
                      <span className="log-n">{l.pinned ? <Star size={9}/> : pad(i+1)}</span>
                      <span className="log-main">
                        <span className="log-t">{l.title||"무제"}{isHtml(l)?<span className="log-badge">HTML</span>:null}</span>
                        <span className="log-ex">{plainOf(l).slice(0,80)}</span>
                      </span>
                      <span className="log-side"><span>{fmtDate(l.date)}</span></span>
                    </button>
                  </li>
                ))}
              </ul>
            ) : <div className="panel-body"><p className="note" style={{margin:0}}>작성한 글이 아직 없습니다.</p></div>}
          </Panel>
        </div>
      </div>
    </>
  );
}

/* ═══════════════════════════════════════════════════════════
   01 · D-DAY
   ═══════════════════════════════════════════════════════════ */
function PairsView({ pairs, setPairs, intent, clear }){
  const [editing, setEditing] = useState(null);
  useEffect(()=>{
    if (!intent) return;
    if (intent.action==="new") setEditing({});
    if (intent.focus){ const p = pairs.find(x=>x.id===intent.focus); if (p) setEditing(p); }
    clear();
  },[intent]);

  const sorted = useMemo(()=>[...pairs].sort((a,b)=>
    (!!b.pinned!==!!a.pinned) ? (b.pinned?1:-1) : (a.startDate<b.startDate?-1:1)),[pairs]);

  const soon = useMemo(()=>pairs.map(p=>{
    const count = countFrom(p.startDate);
    const { next } = nextMilestone(p.startDate, count);
    if (!next) return null;
    const left = next.count - count;
    return left<=30 ? { p, label:next.label, left, on:addDaysISO(p.startDate, next.count-1) } : null;
  }).filter(Boolean).sort((a,b)=>a.left-b.left),[pairs]);

  return (<>
    {soon.length ? (
      <Panel idx="NXT" title="UPCOMING / 다가오는 기념일" meta={`${pad(soon.length)}`} flush>
        <ul className="soon">
          {soon.map(s=>(
            <li key={s.p.id}>
              <span className="soon-d">{s.left===0 ? "TODAY" : `D-${s.left}`}</span>
              <span className="soon-main"><b>{s.p.nameA} × {s.p.nameB}</b><span>{s.label}</span></span>
              <span className="soon-date">{fmtDate(s.on)}</span>
            </li>
          ))}
        </ul>
      </Panel>
    ) : null}

    <Panel idx="01" title="PAIRS / 페어 기록" meta={`${pad(pairs.length)} PAIRS`} flush
      actions={<Btn variant="primary" onClick={()=>setEditing({})}>+ 페어 추가</Btn>}>
      {pairs.length===0 ? (
        <Empty line="아직 기록 중인 페어가 없습니다. 첫 페어와 시작일을 등록하면 오늘이 며칠째인지 세기 시작합니다."
          action={<Btn variant="primary" onClick={()=>setEditing({})}>+ 페어 추가</Btn>}/>
      ) : (
        <div className="grid grid-pairs">
          {sorted.map(p=>(
            <PairCard key={p.id} p={p} onEdit={()=>setEditing(p)}
              onDelete={()=>setPairs(list=>list.filter(x=>x.id!==p.id))}/>
          ))}
        </div>
      )}
    </Panel>

    {editing && <PairForm initial={editing} onCancel={()=>setEditing(null)} onSubmit={d=>{
      setPairs(list => d.id ? list.map(x=>x.id===d.id?d:x) : [...list, {...d, id:uid()}]);
      setEditing(null);
    }}/>}
  </>);
}

function PairCard({ p, onEdit, onDelete }){
  const count = countFrom(p.startDate);
  const { next, prevCount } = nextMilestone(p.startDate, count);
  const span = next ? next.count - prevCount : 1;
  const done = next ? Math.max(0, Math.min(1,(count-prevCount)/span)) : 1;
  const left = next ? next.count - count : 0;
  return (
    <article className="card">
      <div className="card-head">
        <span className="card-tag">{p.pinned ? <><Star size={9}/> PINNED</> : "PAIR"}</span>
        <span>SINCE {fmtDate(p.startDate)}</span>
      </div>
      <h3 className="pair-name">{p.nameA}<span className="cross"> × </span>{p.nameB}</h3>
      {p.title ? <p className="pair-sub">{p.title}</p> : null}
      <div className="count">
        <span className="pre">D+</span>
        <span className="big num">{count>0?count:0}</span>
        <span className="unit">일째</span>
      </div>
      {next ? (
        <div className="ms">
          <div className="ms-row"><span>NEXT · {next.label}</span><span>{left===0?"TODAY":`${left}일 남음`}</span></div>
          <div className="ms-track"><span className="ms-fill" style={{width:`${done*100}%`}}/></div>
          <div className="ms-row ms-foot"><span>{fmtDate(addDaysISO(p.startDate,next.count-1))}</span><span>{Math.round(done*100)}%</span></div>
        </div>
      ) : null}
      {p.memo ? <p className="card-memo">{p.memo}</p> : null}
      <div className="card-foot">
        <button className="mini" onClick={onEdit}>수정</button>
        <button className="mini del" onClick={()=>{ if(confirm(`'${p.nameA} × ${p.nameB}' 기록을 삭제할까요?`)) onDelete(); }}>삭제</button>
      </div>
    </article>
  );
}

function PairForm({ initial, onCancel, onSubmit }){
  const [f,setF] = useState({ id:initial.id, nameA:initial.nameA||"", nameB:initial.nameB||"",
    title:initial.title||"", startDate:initial.startDate||todayISO(), memo:initial.memo||"", pinned:!!initial.pinned });
  const set = k => e => setF({...f,[k]:e.target.value});
  const preview = countFrom(f.startDate);
  return (
    <Modal idx={initial.id?"01·EDIT":"01·NEW"} title={initial.id?"페어 수정":"페어 추가"} onClose={onCancel}>
      <div className="form">
        <div className="f2">
          <Field label="캐릭터 A"><input className="in" value={f.nameA} onChange={set("nameA")} placeholder="이름"/></Field>
          <Field label="캐릭터 B"><input className="in" value={f.nameB} onChange={set("nameB")} placeholder="이름"/></Field>
        </div>
        <Field label="페어 부제" hint="선택"><input className="in" value={f.title} onChange={set("title")} placeholder="예: The Luminiferous Form"/></Field>
        <Field label="시작일" hint="이 날이 1일째"><input type="date" className="in" value={f.startDate} onChange={set("startDate")}/></Field>
        <div className="preview"><span>오늘 기준</span><strong>D+{preview>0?preview:0}일째</strong></div>
        <Field label="메모" hint="선택"><textarea className="in ta" rows={3} value={f.memo} onChange={set("memo")}/></Field>
        <label className="check"><input type="checkbox" checked={f.pinned}
          onChange={e=>setF({...f,pinned:e.target.checked})}/><span>목록 맨 위에 고정</span></label>
        <div className="foot">
          <Btn onClick={onCancel}>취소</Btn>
          <Btn variant="primary" onClick={()=>{
            if(!f.nameA.trim()||!f.nameB.trim()) return alert("두 캐릭터 이름을 모두 입력해 주세요.");
            if(!f.startDate) return alert("시작일을 선택해 주세요.");
            onSubmit(f);
          }}>{initial.id?"변경 저장":"페어 저장"}</Btn>
        </div>
      </div>
    </Modal>
  );
}

/* ═══════════════════════════════════════════════════════════
   02 · GALLERY — 한 게시물에 여러 장
   ═══════════════════════════════════════════════════════════ */
const imagesOf = it => (it && it.images && it.images.length)
  ? it.images
  : (it && it.src ? [{ id: it.id, src: it.src, path: it.path || null }] : []);

function GalleryView({ gallery, setGallery, pairs, store, setStatus, intent, clear }){
  const [editing, setEditing] = useState(null);
  const [view, setView] = useState(null);
  const [fPair, setFPair] = useState("");
  const [fTag, setFTag] = useState("");
  const [sort, setSort] = useState("new");
  const [dense, setDense] = useState(false);

  useEffect(()=>{
    if (!intent) return;
    if (intent.action==="new") setEditing({});
    if (intent.focus){ const g = gallery.find(x=>x.id===intent.focus); if (g) setView(g); }
    clear();
  },[intent]);

  const tags = useMemo(()=>{
    const c = new Map();
    gallery.forEach(g=>(g.tags||[]).forEach(t=>c.set(t,(c.get(t)||0)+1)));
    return [...c.entries()].sort((a,b)=>b[1]-a[1] || (a[0]<b[0]?-1:1));
  },[gallery]);

  const list = useMemo(()=>{
    const arr = gallery
      .filter(g=>fPair?g.pairId===fPair:true)
      .filter(g=>fTag?(g.tags||[]).includes(fTag):true);
    const byDate = (a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0);
    return arr.sort(sort==="old" ? (a,b)=>-byDate(a,b) : byDate);
  },[gallery,fPair,fTag,sort]);

  const submit = async (form, entries, removed, onProgress) => {
    const id = form.id || uid();
    const images = [];
    const fileCount = entries.filter(e=>e.kind==="file").length;
    let done = 0;
    if (fileCount) setStatus("UPLOADING");

    for (const e of entries){
      if (e.kind === "file"){
        onProgress && onProgress(done, fileCount);
        const imgId = uid();
        try{
          const { blob, dataUrl } = await compress(e.file);
          const { src, path } = await store.putImage(imgId, blob, dataUrl);
          images.push({ id: imgId, src, path });
        }catch(err){
          setStatus("SAVE FAILED");
          alert(`'${e.file.name}'을(를) 저장하지 못했습니다. ${err.message||""}`
            + (images.length ? `\n먼저 올라간 ${images.length}장은 그대로 저장됩니다.` : ""));
          break;
        }
        done++;
      } else {
        images.push({ id: e.id || uid(), src: e.src, path: e.path || null });
      }
    }
    onProgress && onProgress(fileCount, fileCount);
    if (!images.length) return alert("이미지를 한 장 이상 넣어 주세요.");

    for (const rm of (removed||[])){ try{ await store.delImage(rm); }catch(err){} }

    const item = { ...form, id, images, createdAt: form.createdAt || Date.now() };
    delete item.src; delete item.path;
    setGallery(l => l.some(g=>g.id===id) ? l.map(g=>g.id===id?item:g) : [item, ...l]);
    setEditing(null);
  };

  const remove = async item => {

      </>}>
      {tags.length ? (
        <div className="chips">
          <button className={`chip ${fTag===""?"on":""}`} onClick={()=>setFTag("")}>전체</button>
          {tags.map(([t,n])=>(
            <button key={t} className={`chip ${fTag===t?"on":""}`} onClick={()=>setFTag(fTag===t?"":t)}>#{t}<i>{n}</i></button>

      ) : list.length===0 ? (

      ) : (
        <div className={`grid grid-gal ${dense?"dense":""}`}>
          {list.map((g,i)=>{
            const imgs = imagesOf(g);
            return (
              <button key={g.id} className="thumb" onClick={()=>setView(g)}>
                <span className="frame">
                  <Pic item={imgs[0]||{}} store={store} alt={g.title||"작품"}/>
                  {imgs.length>1 ? <span className="cnt">{pad(imgs.length)}</span> : null}
                </span>

function GalleryDetail({ item, pairs, store, onClose, onEdit, onDelete }){
  const imgs = imagesOf(item);
  const [n, setN] = useState(0);
  const [zoom, setZoom] = useState(false);
  const cur = imgs[Math.min(n, imgs.length-1)] || {};
  const go = d => setN(v => (v + d + imgs.length) % imgs.length);
  const touch = useRef(null);

  useEffect(()=>{
    const h = e => {
      if (e.key==="Escape" && zoom){ e.stopPropagation(); setZoom(false); return; }
      if (imgs.length<2) return;
      if (e.key==="ArrowRight") go(1);
      if (e.key==="ArrowLeft") go(-1);
    };
    window.addEventListener("keydown", h, true);
    return ()=>window.removeEventListener("keydown", h, true);
  },[imgs.length, zoom]);

  const onTouchStart = e => { touch.current = { x:e.touches[0].clientX, y:e.touches[0].clientY }; };
  const onTouchEnd = e => {
    if (!touch.current || imgs.length<2) return;
    const dx = e.changedTouches[0].clientX - touch.current.x;
    const dy = e.changedTouches[0].clientY - touch.current.y;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
    touch.current = null;
  };

  return (
    <Modal idx="02·VIEW" title={item.title||"UNTITLED"} onClose={onClose} wide>
      <div className="view">
        <div className="stage" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
          <button className="view-img" onClick={()=>setZoom(true)} aria-label="크게 보기">
            <Pic item={cur} store={store} alt={item.title||"작품"}/>
          </button>
          {imgs.length>1 ? (<>
            <button className="nav prev" onClick={()=>go(-1)} aria-label="이전 이미지">‹</button>
            <button className="nav next" onClick={()=>go(1)} aria-label="다음 이미지">›</button>
            <span className="pageno">{pad(n+1)} / {pad(imgs.length)}</span>
          </>) : null}
        </div>

        {imgs.length>1 ? (
          <div className="strip">
            {imgs.map((im,i)=>(
              <button key={im.id||i} className={`stripcell ${i===n?"on":""}`} onClick={()=>setN(i)}
                aria-label={`${i+1}번째 이미지 보기`} aria-current={i===n}>
                <Pic item={im} store={store} alt=""/>
              </button>
            ))}
          </div>
        ) : null}

        <dl className="metagrid">
          <div><dt>작가</dt><dd>{item.artist||"—"}</dd></div>
          <div><dt>받은 날</dt><dd>{fmtDate(item.date)||"—"}</dd></div>
          <div><dt>페어</dt><dd>{(()=>{const p=pairs.find(x=>x.id===item.pairId); return p?`${p.nameA} × ${p.nameB}`:"—";})()}</dd></div>
          <div><dt>장수</dt><dd>{imgs.length}장</dd></div>
          <div><dt>태그</dt><dd>{(item.tags||[]).length?item.tags.map(t=>`#${t}`).join(" "):"—"}</dd></div>
          {item.note ? <div className="wide"><dt>메모</dt><dd className="pre">{item.note}</dd></div> : null}
        </dl>
        <div className="foot">
          <Btn onClick={onEdit}>수정</Btn>
          <Btn variant="danger" onClick={onDelete}>삭제</Btn>
        </div>
      </div>

      {zoom ? (
        <div className="zoom" onClick={()=>setZoom(false)} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
          <Pic item={cur} store={store} alt={item.title||"작품"}/>
          <span className="zoom-hint">{imgs.length>1 ? `${pad(n+1)} / ${pad(imgs.length)} · 좌우로 넘기기 · ` : ""}화면을 누르면 닫힙니다</span>
        </div>
      ) : null}
    </Modal>
  );
}

function GalleryForm({ initial, pairs, store, onCancel, onSubmit }){
  const [f,setF] = useState({ id:initial.id, title:initial.title||"", artist:initial.artist||"",
    date:initial.date||todayISO(), pairId:initial.pairId||"", tags:(initial.tags||[]).join(", "),
    note:initial.note||"", createdAt:initial.createdAt });
  const [entries, setEntries] = useState(()=>imagesOf(initial).map(im=>({
    kind:"keep", key:im.id||uid(), id:im.id, src:im.src, path:im.path||null })));
  const [removed, setRemoved] = useState([]);
  const [urlInput, setUrlInput] = useState("");
  const [busy, setBusy] = useState(false);
  const [prog, setProg] = useState(null);
  const set = k => e => setF({...f,[k]:e.target.value});

  const addFiles = e => {
    const picked = Array.from(e.target.files || []);
    if (!picked.length) return;
    setEntries(prev => [...prev, ...picked.map(file=>({
      kind:"file", key:uid(), file, src:URL.createObjectURL(file) }))]);
    e.target.value = "";
  };
  const addUrl = () => {
    const u = urlInput.trim();
    if (!u) return;
    setEntries(prev => [...prev, { kind:"url", key:uid(), src:u }]);
    setUrlInput("");
  };
  const drop = i => setEntries(prev => {
    const e = prev[i];
    if (e.kind==="file") URL.revokeObjectURL(e.src);
    if (e.kind==="keep") setRemoved(r=>[...r, { id:e.id, src:e.src, path:e.path }]);
    return prev.filter((_,k)=>k!==i);
  });
  const move = (i, d) => setEntries(prev => {
    const j = i + d;
    if (j<0 || j>=prev.length) return prev;
    const next = [...prev];
    [next[i], next[j]] = [next[j], next[i]];
    return next;
  });

  return (
    <Modal idx={initial.id?"02·EDIT":"02·NEW"} title={initial.id?"게시물 수정":"그림 등록"} onClose={onCancel} wide>
      <div className="form">
        <Field label="이미지" hint="여러 장 가능 · 첫 장이 대표">
          <div className="addrow">
            <label className="btn filebtn">파일 추가
              <input type="file" accept="image/*" multiple onChange={addFiles}/>
            </label>
            <input className="in" value={urlInput} onChange={e=>setUrlInput(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); addUrl(); } }}
              placeholder="이미지 주소로 추가 (https://…)"/>
            <Btn onClick={addUrl}>주소 추가</Btn>
          </div>
        </Field>

        {entries.length ? (
          <div className="prevwrap">
            <div className="prevhead">
              <span>{pad(entries.length)}장 · 왼쪽부터 순서대로</span>
              <button className="linkbtn" onClick={()=>{
                entries.forEach(e=>{ if(e.kind==="file") URL.revokeObjectURL(e.src);
                  if(e.kind==="keep") setRemoved(r=>[...r,{id:e.id,src:e.src,path:e.path}]); });
                setEntries([]);
              }}>모두 빼기</button>
            </div>
            <div className="prevgrid">
              {entries.map((e,i)=>(
                <div className={`prevcell ${i===0?"cover":""}`} key={e.key}>
                  <img src={e.src} alt={`이미지 ${i+1}`}/>
                  <span className="prevn">{i===0?"대표":pad(i+1)}</span>
                  <button className="prevx" onClick={()=>drop(i)} aria-label={`${i+1}번째 이미지 빼기`}><XIcon/></button>
                  <span className="prevmove">
                    <button onClick={()=>move(i,-1)} disabled={i===0} aria-label="앞으로">‹</button>
                    <button onClick={()=>move(i,1)} disabled={i===entries.length-1} aria-label="뒤로">›</button>
                  </span>
                </div>
              ))}
            </div>
          </div>
        ) : <p className="note small" style={{margin:0}}>아직 넣은 이미지가 없습니다.</p>}

        <div className="f2">
          <Field label="제목"><input className="in" value={f.title} onChange={set("title")} placeholder="작품 제목"/></Field>
          <Field label="작가"><input className="in" value={f.artist} onChange={set("artist")} placeholder="아이디 / 이름"/></Field>
        </div>
        <div className="f2">
          <Field label="받은 날"><input type="date" className="in" value={f.date} onChange={set("date")}/></Field>
          <Field label="페어" hint="선택">
            <select className="in" value={f.pairId} onChange={set("pairId")}>
              <option value="">연결 안 함</option>
              {pairs.map(p=><option key={p.id} value={p.id}>{p.nameA} × {p.nameB}</option>)}
            </select>
          </Field>
        </div>
        <Field label="태그" hint="쉼표로 구분"><input className="in" value={f.tags} onChange={set("tags")} placeholder="일러스트, 반신, 생일"/></Field>
        <Field label="메모" hint="선택"><textarea className="in ta" rows={3} value={f.note} onChange={set("note")}/></Field>

        <div className="foot">
          <Btn onClick={onCancel} disabled={busy}>취소</Btn>
          <Btn variant="primary" disabled={busy} onClick={async()=>{
            if (!entries.length) return alert("이미지를 한 장 이상 넣어 주세요.");
            setBusy(true);
            await onSubmit({...f, tags:f.tags.split(",").map(t=>t.trim()).filter(Boolean)},
              entries, removed, (done,total)=>setProg({done,total}));
            setProg(null); setBusy(false);
          }}>
            {busy ? (prog && prog.total>1 ? `올리는 중 ${prog.done}/${prog.total}` : "저장 중…")
              : initial.id ? "변경 저장" : `아카이브에 추가${entries.length>1?` (${entries.length}장)`:""}`}
          </Btn>
        </div>
      </div>
    </Modal>
  );
}

function LogsView({ logs, setLogs, pairs, intent, clear }){
  const [editing,setEditing] = useState(null);
  const [open,setOpen] = useState(null);
  const [q,setQ] = useState("");
  const [fPair,setFPair] = useState("");
  const [fTag,setFTag] = useState("");
  const [sort,setSort] = useState("new");

  useEffect(()=>{
    if (!intent) return;
    if (intent.action==="new") setEditing({});
    if (intent.focus){ const l = logs.find(x=>x.id===intent.focus); if (l) setOpen(l); }
    clear();
  },[intent]);

  const tags = useMemo(()=>{
    const c = new Map();
    logs.forEach(l=>(l.tags||[]).forEach(t=>c.set(t,(c.get(t)||0)+1)));
    return [...c.entries()].sort((a,b)=>b[1]-a[1] || (a[0]<b[0]?-1:1));
  },[logs]);

  const list = useMemo(()=>{
    const n=q.trim().toLowerCase();
    const arr = logs.filter(l=>fPair?l.pairId===fPair:true)
      .filter(l=>fTag?(l.tags||[]).includes(fTag):true)
      .filter(l=>n?((l.title||"")+" "+plainOf(l)+" "+(l.tags||[]).join(" ")).toLowerCase().includes(n):true);
    const byDate = (a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0);
    const cmp = sort==="old" ? (a,b)=>-byDate(a,b)
      : sort==="title" ? (a,b)=>(a.title||"").localeCompare(b.title||"","ko")
      : byDate;
    return arr.sort((a,b)=> (!!b.pinned!==!!a.pinned) ? (b.pinned?1:-1) : cmp(a,b));
  },[logs,q,fPair,fTag,sort]);

  const togglePin = id => {
    setLogs(l=>l.map(x=>x.id===id?{...x, pinned:!x.pinned}:x));
    setOpen(o=>o && o.id===id ? {...o, pinned:!o.pinned} : o);
  };

  return (<>
    <Panel idx="03" title="LOGS / 글 아카이브" meta={`${pad(list.length)} / ${pad(logs.length)}`} flush
      actions={<>
        <Btn variant="primary" onClick={()=>setEditing({})}>+ 새 글 쓰기</Btn>
        <input className="search" value={q} onChange={e=>setQ(e.target.value)} placeholder="제목·본문·태그 검색"/>
        <select className="sel" value={fPair} onChange={e=>setFPair(e.target.value)}>
          <option value="">모든 페어</option>
          {pairs.map(p=><option key={p.id} value={p.id}>{p.nameA} × {p.nameB}</option>)}
        </select>
        <select className="sel" value={sort} onChange={e=>setSort(e.target.value)}>
          <option value="new">최신순</option>
          <option value="old">오래된순</option>
          <option value="title">제목순</option>
        </select>
      </>}>
      {tags.length ? (
        <div className="chips">
          <button className={`chip ${fTag===""?"on":""}`} onClick={()=>setFTag("")}>전체</button>
          {tags.map(([t,n])=>(
            <button key={t} className={`chip ${fTag===t?"on":""}`} onClick={()=>setFTag(fTag===t?"":t)}>#{t}<i>{n}</i></button>
          ))}
        </div>
      ) : null}
      {logs.length===0 ? (
        <Empty line="첫 로그를 남겨 보세요. 마크다운으로 쓰거나, 백업해 둔 HTML을 그대로 붙여넣을 수 있습니다."
          action={<Btn variant="primary" onClick={()=>setEditing({})}>+ 새 글 쓰기</Btn>}/>
      ) : list.length===0 ? (
        <Empty line="검색 결과가 없습니다. 다른 낱말로 찾아보세요."/>
      ) : (
        <ul className="logs">
          {list.map((l,i)=>{
            const p = pairs.find(x=>x.id===l.pairId);
            return (
              <li key={l.id}>
                <button className="log" onClick={()=>setOpen(l)}>
                  <span className="log-n">{l.pinned ? <Star size={9}/> : pad(list.length-i)}</span>
                  <span className="log-main">
                    <span className="log-t">{l.title||"무제"}{isHtml(l)?<span className="log-badge">HTML</span>:null}</span>
                    <span className="log-ex">{plainOf(l).slice(0,90)}</span>
                  </span>
                  <span className="log-side">
                    <span>{fmtDate(l.date)}</span>
                    <span className="log-pair">{p?`${p.nameA}×${p.nameB}`:"—"}</span>
                  </span>
                </button>
              </li>
            );
          })}
        </ul>
      )}
    </Panel>

    {editing && <LogForm initial={editing} pairs={pairs} onCancel={()=>setEditing(null)} onSubmit={d=>{
      const now=Date.now();
      setLogs(l => d.id ? l.map(x=>x.id===d.id?{...d,updatedAt:now}:x) : [{...d,id:uid(),createdAt:now,updatedAt:now}, ...l]);
      setEditing(null); setOpen(null);
    }}/>}

    {open && (
      <Modal idx="03·READ" title={open.title||"무제"} onClose={()=>setOpen(null)} wide>
        <div>
          <div className="read-meta">
            <span>{fmtDate(open.date)}</span>
            <span>{(()=>{const p=pairs.find(x=>x.id===open.pairId); return p?`${p.nameA} × ${p.nameB}`:"페어 없음";})()}</span>
            <span>{isHtml(open)?"HTML · ":""}{plainOf(open).length.toLocaleString()}자 · 약 {Math.max(1,Math.round(plainOf(open).length/500))}분</span>
            {(open.tags||[]).length ? <span>{open.tags.map(t=>`#${t}`).join(" ")}</span> : null}
          </div>
          <Body log={open} className="read-body" style={{fontSize:(open.fontSize||14)+"px"}}/>
          <div className="foot">
            <Btn onClick={()=>togglePin(open.id)}>{open.pinned ? "고정 해제" : "맨 위 고정"}</Btn>
            <Btn onClick={()=>{ setEditing(open); setOpen(null); }}>수정</Btn>
            <Btn variant="danger" onClick={()=>{ if(confirm("이 글을 삭제할까요?")){ setLogs(l=>l.filter(x=>x.id!==open.id)); setOpen(null);} }}>삭제</Btn>
          </div>
        </div>
      </Modal>
    )}
  </>);
}

const DRAFT_KEY = "archive.draft";

    date:initial.date||todayISO(), pairId:initial.pairId||"", tags:(initial.tags||[]).join(", "),

    format:initial.format||"md", createdAt:initial.createdAt });
  const [tab,setTab] = useState("write");
  const [draft,setDraft] = useState(null);
  const set = k => e => setF({...f,[k]:e.target.value});
  const isNew = !initial.id;

  useEffect(()=>{
    if (!isNew) return;
    try{
      const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
      if (d && (d.title || d.body)) setDraft(d);
    }catch(e){}
  },[isNew]);
  useEffect(()=>{
    if (!isNew) return;
    const t = setTimeout(()=>{
      try{
        if (f.title || f.body) localStorage.setItem(DRAFT_KEY, JSON.stringify({...f, at:Date.now()}));
      }catch(e){}
    }, 700);
    return ()=>clearTimeout(t);

  const clearDraft = ()=>{ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} };
  const chars = plainOf(f).length;

  return (
    <Modal idx={initial.id?"03·EDIT":"03·NEW"} title={initial.id?"글 수정":"새 글"} onClose={onCancel} wide>

          <div className="draftbar">

              <button onClick={()=>{ const {at, ...rest}=draft; setF({...f, ...rest}); setDraft(null); }}>이어 쓰기</button>
              <button onClick={()=>{ clearDraft(); setDraft(null); }}>버리기</button>

          </div>
