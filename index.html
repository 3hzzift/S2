        <Field label="제목"><input className="in lg" value={f.title} onChange={set("title")} placeholder="제목"/></Field>
        <div className="f2">
          <Field label="날짜"><input type="date" className="in" value={f.date} onChange={set("date")}/></Field>
          <Field label="페어" hint="선택">
            <select className="in" value={f.pairId} onChange={set("pairId")}>
              <option value="">연결 안 함</option>
              {pairs.map(p=><option key={p.id} value={p.id}>{p.nameA} × {p.nameB}</option>)}
            </select>
          </Field>
        </div>

        <div className="field">
          <span className="lab">본문<em>{f.format==="html" ? "HTML 코드" : "마크다운"}</em></span>
          <div className="seg fmtseg">
            <button className={f.format!=="html"?"on":""} onClick={()=>setF({...f, format:"md"})}>마크다운</button>
            <button className={f.format==="html"?"on":""} onClick={()=>setF({...f, format:"html"})}>HTML</button>
          </div>
          <div className="editbar">
            <div className="seg">
              <button className={tab==="write"?"on":""} onClick={()=>setTab("write")}>쓰기</button>
              <button className={tab==="prev"?"on":""} onClick={()=>setTab("prev")}>미리보기</button>
            </div>
            <div className="sizer">
              <span className="sizer-lab">글자 크기</span>
              <button onClick={()=>setF({...f, fontSize:Math.max(11,(f.fontSize||14)-1)})}
                disabled={(f.fontSize||14)<=11} aria-label="글자 작게">−</button>
              <b>{f.fontSize||14}</b>
              <button onClick={()=>setF({...f, fontSize:Math.min(24,(f.fontSize||14)+1)})}
                disabled={(f.fontSize||14)>=24} aria-label="글자 크게">+</button>
              {(f.fontSize||14)!==14 ? <button className="sizer-reset" onClick={()=>setF({...f, fontSize:14})}>기본</button> : null}
            </div>
          </div>
          {tab==="write" ? (<>
            <textarea className={`in ta lg ${f.format==="html"?"codearea":""}`} rows={14} value={f.body} onChange={set("body")}
              style={f.format==="html" ? null : {fontSize:(f.fontSize||14)+"px"}}
              spellCheck={f.format!=="html"}
              placeholder={f.format==="html"
                ? "<p>백업해 둔 HTML 코드를 그대로 붙여넣으세요.</p>"
                : "# 제목\n\n**굵게**, *기울임*, ~~취소선~~\n\n> 인용문\n- 목록\n\n[링크](https://example.com)"}/>
            <p className="mdhint">
              <b>{chars.toLocaleString()}자</b> · 약 {Math.max(1,Math.round(chars/500))}분 분량{isNew ? " · 자동 임시저장 중" : ""}<br/>
              {f.format==="html" ? (<>
                붙여넣은 코드는 그대로 보관되고, 볼 때 화면에 맞춰 표시됩니다.<br/>
                안전을 위해 <b>script</b>·<b>iframe</b>·<b>style</b> 태그와 이벤트 속성은 표시할 때 빠집니다.
              </>) : (<>
                글자 크기는 미리보기와 저장된 글에 적용됩니다.<br/>
                <b># 제목</b> · <b>**굵게**</b> · <b>*기울임*</b> · <b>~~취소선~~</b> · <b>&gt; 인용</b> ·
                <b> - 목록</b> · <b>1. 번호</b> · <b>[글자](주소)</b> · <b>![](이미지주소)</b> · <b>---</b> 구분선
              </>)}
            </p>
          </>) : (
            f.body.trim()
              ? <div className="mdprev"><Body log={f} style={{fontSize:(f.fontSize||14)+"px"}}/></div>
              : <div className="mdprev empty-prev">아직 쓴 내용이 없습니다.</div>
          )}
        </div>

        <Field label="태그" hint="쉼표로 구분"><input className="in" value={f.tags} onChange={set("tags")} placeholder="일상, 설정, 대화"/></Field>
        <label className="check"><input type="checkbox" checked={f.pinned}
          onChange={e=>setF({...f,pinned:e.target.checked})}/><span>목록 맨 위에 고정</span></label>

        <div className="foot">
          <Btn onClick={()=>{ if(isNew && (f.title||f.body) && !confirm("쓰던 내용은 임시저장되어 다음에 이어 쓸 수 있습니다. 닫을까요?")) return; onCancel(); }}>취소</Btn>
          <Btn variant="primary" onClick={()=>{
            if(!f.title.trim() && !f.body.trim()) return alert("제목이나 본문 중 하나는 채워 주세요.");
            clearDraft();
            onSubmit({...f, tags:f.tags.split(",").map(t=>t.trim()).filter(Boolean)});
          }}>{initial.id?"변경 저장":"글 저장"}</Btn>
        </div>
      </div>
    </Modal>
  );
}

/* ═══════════════════════════════════════════════════════════
   04 · SETTINGS
   ═══════════════════════════════════════════════════════════ */
const PRESETS = [["BLUE","#1F4BFF"],["COBALT","#0057D9"],["RED","#E8290B"],["ORANGE","#FF6A00"],
  ["GREEN","#0E9F6E"],["VIOLET","#6E3BFF"],["PINK","#F0399B"],["INK","#0A0A0B"]];

function SettingsView({ data, setSettings, store, mutate, onSignOut }){
  const [d,setD] = useState(data.settings);
  useEffect(()=>setD(data.settings),[data.settings]);

  const exportJSON = () => {
    const blob = new Blob([JSON.stringify({exportedAt:new Date().toISOString(), ...data},null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`archive-backup-${todayISO()}.json`; a.click(); URL.revokeObjectURL(a.href);
  };
  const importJSON = async e => {
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    try{
      const j = JSON.parse(await file.text());
      const merge=(cur,add)=>{ const m=new Map((cur||[]).map(x=>[x.id,x])); (add||[]).forEach(x=>x&&x.id&&m.set(x.id,x)); return [...m.values()]; };
      mutate(prev=>({...prev,
        settings:{...prev.settings, ...(j.settings||{})},
        pairs:merge(prev.pairs,j.pairs), gallery:merge(prev.gallery,j.gallery), logs:merge(prev.logs,j.logs)}));
      alert("백업을 불러왔습니다. 같은 항목은 백업 내용으로 덮어썼습니다.");
    }catch(err){ alert("파일을 읽지 못했습니다. 이 아카이브에서 내보낸 JSON인지 확인해 주세요."); }
    e.target.value="";
  };

  return (
    <>
      <div className="cols">
        <div className="c6">
          <Panel idx="04" title="THEME / 화면 모드">
            <div className="seg">
              {[["light","라이트"],["dark","다크"],["auto","기기 설정"]].map(([v,label])=>(
                <button key={v} className={(d.theme||"auto")===v?"on":""} onClick={()=>setSettings({theme:v})}>{label}</button>
              ))}
            </div>
            <p className="note">기기 설정을 고르면 휴대폰이 야간 모드로 바뀔 때 함께 어두워집니다.</p>
          </Panel>
        </div>
        <div className="c6">
          <Panel idx="05" title="ARCHIVE / 이름">
            <div className="f2">
              <Field label="아카이브 제목">
                <input className="in" value={d.title} onChange={e=>setD({...d,title:e.target.value})}
                  onBlur={()=>setSettings({title:d.title})}/>
              </Field>
              <Field label="기록자" hint="선택">
                <input className="in" value={d.owner} onChange={e=>setD({...d,owner:e.target.value})}
                  onBlur={()=>setSettings({owner:d.owner})}/>
              </Field>
            </div>
          </Panel>
        </div>
      </div>

      <Panel idx="06" title="ACCENT / 포인트 컬러">
        <div className="sws">
          {PRESETS.map(([name,hex])=>(
            <button key={hex} className={`sw ${(d.accent||"").toUpperCase()===hex?"on":""}`}
              onClick={()=>setSettings({accent:hex})} title={name}>
              <span style={{background:hex}}/><em>{name}</em>
            </button>
          ))}
        </div>
        <div className="f2 mt">
          <Field label="직접 고르기">
            <input type="color" className="color" value={d.accent} onChange={e=>setSettings({accent:e.target.value})}/>
          </Field>
          <Field label="HEX 코드">
            <input className="in" value={d.accent} onChange={e=>setD({...d,accent:e.target.value})}
              onBlur={()=>/^#[0-9a-fA-F]{6}$/.test(d.accent)&&setSettings({accent:d.accent})} placeholder="#1F4BFF"/>
          </Field>
        </div>
      </Panel>

      <Panel idx="07" title="ACCOUNT / 계정과 저장">
        <p className="note" style={{marginTop:0}}>
          {store.mode==="cloud"
            ? `${store.label} 계정으로 로그인되어 있습니다. 기록과 이미지는 계정에 저장되므로 다른 기기·브라우저에서 같은 아이디로 로그인하면 그대로 이어집니다.`
            : "지금은 연결 없이 이 브라우저에만 저장하는 모드입니다. 다른 기기에서는 보이지 않고, 브라우저 데이터를 지우면 사라집니다."}
        </p>
        <dl className="metagrid mt">
          <div><dt>페어</dt><dd>{data.pairs.length}건</dd></div>
          <div><dt>게시물</dt><dd>{data.gallery.length}건</dd></div>
          <div><dt>이미지</dt><dd>{data.gallery.reduce((n,g)=>n+imagesOf(g).length,0)}장</dd></div>
          <div><dt>로그</dt><dd>{data.logs.length}건</dd></div>
        </dl>
        <div className="foot mt">
          <Btn onClick={exportJSON}>백업 내려받기</Btn>
          <label className="btn filebtn">백업 불러오기<input type="file" accept="application/json" onChange={importJSON}/></label>
          <Btn variant="danger" onClick={()=>{ if(confirm("로그아웃할까요?")) onSignOut(); }}>로그아웃</Btn>
        </div>
        <p className="note small">백업 파일에는 글·페어·작품 정보가 들어갑니다. 업로드한 이미지 원본은 저장소에 그대로 남습니다.</p>
      </Panel>

      <Panel idx="08" title="SHORTCUT / 단축키">
        <p className="note" style={{marginTop:0}}>
          <span className="kbd">1</span><span className="kbd">2</span><span className="kbd">3</span>
          <span className="kbd">4</span><span className="kbd">5</span> 섹션 이동 ·
          <span className="kbd" style={{marginLeft:8}}>ESC</span> 창 닫기 ·
          <span className="kbd" style={{marginLeft:8}}>←</span><span className="kbd">→</span> 그림 넘기기
        </p>
      </Panel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
